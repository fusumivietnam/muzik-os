name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: muzik_test
          POSTGRES_USER: muzik_ci
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muzik_ci -d muzik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: muzik_test
      DB_USERNAME: muzik_ci
      DB_PASSWORD: ci_only

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # upstream v7.0.1
        with:
          persist-credentials: false

      - name: Require application and lockfiles
        run: |
          test -f artisan
          test -f composer.lock
          test -f package-lock.json

      - name: Setup PHP (candidate runtime)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # upstream v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node (candidate runtime)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # upstream v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Prepare test application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Build frontend
        run: npm run build

      - name: Run upstream CI checks
        run: composer ci:check
